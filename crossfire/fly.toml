app = 'crossfire-colyseus-mdev7'
primary_region = 'syd'

[build]
  dockerfile = 'Dockerfile.colyseus'

[env]
  NODE_ENV = 'production'
  PORT = '2567'

[http_service]
  internal_port = 2567
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '10s'
    method = 'GET'
    path = '/health'

[[vm]]
  cpu_kind = 'shared'
  cpus = 1
  memory = '512mb'
